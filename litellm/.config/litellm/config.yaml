# LiteLLM proxy for Tensorix (api.tensorix.ai).
#
# Wildcard passthrough: any model id Tensorix serves is routable through the
# proxy without listing it here, so upstream renames (e.g. Kimi-K2.6 ->
# kimi-k2.6, deepseek-v4-flash -> deepseek-v4-flash-0731) can never break
# routing again. Consumers (crush) get their model list refreshed by
# `tensorix-sync-models` (bin package) via the tensorix-models-sync.timer.
model_list:
  - model_name: "*"
    litellm_params:
      model: "openai/*"
      api_base: https://api.tensorix.ai/v1
      api_key: os.environ/TENSORIX_API_KEY

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: localhost
    port: 6379
    ttl: 3600
    supported_call_types: ["acompletion", "completion"]
